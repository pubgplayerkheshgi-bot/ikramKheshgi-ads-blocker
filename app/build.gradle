plugins { id 'com.android.application' }

def signingProps = new Properties()
def signingFile = file(System.getProperty("user.home") + "/.ikramkheshgi-signing.properties")
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'com.ikramkheshgi.popupdetector'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ikramkheshgi.popupdetector'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '2.1'
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signingProps["storeFile"])
                storePassword signingProps["storePassword"]
                keyAlias signingProps["keyAlias"]
                keyPassword signingProps["keyPassword"]
            }
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.release
        }
    }
}
